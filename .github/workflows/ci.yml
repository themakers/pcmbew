name: CI / publish
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - run: bun install
      - run: bun run check
      - run: bun run build
      - name: Keep build output out of git
        run: test -z "$(git ls-files dist)"
      - name: Typecheck optional pi example
        working-directory: examples/pi
        run: |
          bun install
          bun run check
      - name: Upload portable skill
        uses: actions/upload-artifact@v4
        with:
          name: pcmbew-skill
          if-no-files-found: error
          path: |
            README.md
            SKILL.md
            LICENSE
            agents/openai.yaml
            references/*.md
            examples/pi/index.ts
            examples/pi/package.json
            examples/pi/tsconfig.json
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - name: Require tag to match package version
        run: |
          bun -e 'const p = await Bun.file("package.json").json(); if (process.env.GITHUB_REF_NAME !== `v${p.version}`) throw new Error("Tag / package version mismatch");'
      - run: bun install
      - name: Publish to npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun x npm@latest publish --registry=https://registry.npmjs.org --access=public --provenance

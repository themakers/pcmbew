name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install
      - run: bun run check
      - run: bun run build
      - run: bun run test
      - name: Check Sigstore crypto primitives
        run: bun scripts/check-crypto.ts
      - run: test -z "$(git ls-files dist artifacts)"
      - run: bun scripts/artifacts.ts
      - run: bun x playwright install --with-deps chromium
      - run: bun run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-candidate
          if-no-files-found: warn
          path: |
            artifacts/*.zip
            artifacts/*.png
            bun.lock
  release-request:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag checked commit and dispatch tag-scoped release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > "$RUNNER_TEMP/existing-tag.json" 2>/dev/null; then
            test "$tag" = 'v1.0.0'
            test "$(jq -r .object.sha "$RUNNER_TEMP/existing-tag.json")" = '35ded6b5e3e6a0ec8360e1b1e727a727f4d90554'
            # Only repair our known, failed first-release tag. Never move a published tag.
            gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name' > "$RUNNER_TEMP/released-tags"
            if grep -Fxq "$tag" "$RUNNER_TEMP/released-tags"; then exit 1; fi
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha="$GITHUB_SHA"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA"
          fi
          gh workflow run release.yml --ref "$tag"

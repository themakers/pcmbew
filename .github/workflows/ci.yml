name: CI / publish
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - run: bun install
      - run: bun run check
      - run: bun run build
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/master' && contains(github.event.head_commit.message, '[publish]'))
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - name: Require tag to match package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          bun -e 'const p = await Bun.file("package.json").json(); if (process.env.GITHUB_REF_NAME !== `v${p.version}`) throw new Error("Tag / package version mismatch");'
      - run: bun install
      - run: bun run build
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$HOME/.npmrc"
          bun publish --access public

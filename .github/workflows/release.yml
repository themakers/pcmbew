name: Release
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      npm_only:
        description: Publish an existing checked GitHub release to npm without rebuilding or changing its tag
        type: boolean
        default: false
      tag:
        description: Existing release tag for npm-only retry
        type: string
        default: v1.0.0
permissions:
  contents: read
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.npm_only
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check release identity
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: bun install
      - run: bun run check
      - run: bun run build
      - run: bun run test
      - run: bun scripts/check-crypto.ts
      - run: test -z "$(git ls-files dist artifacts)"
      - run: bun scripts/artifacts.ts
      - run: bun x playwright install --with-deps chromium
      - run: bun run test:browser
      - run: bun x npm@11.5.1 pack --ignore-scripts --pack-destination artifacts
      - run: bun scripts/release.ts
      - name: Publish complete GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "WebMCP Bridge $GITHUB_REF_NAME" --notes "Native WebMCP extension and host. Read README/SKILL.md for agent-led setup. Five stable MCP tools on localhost:8777."
          gh release upload "$GITHUB_REF_NAME" artifacts/runtime.zip artifacts/extension.zip artifacts/skill.zip artifacts/*.tgz artifacts/release.json artifacts/release.sigstore.json
          gh release edit "$GITHUB_REF_NAME" --draft=false
      - name: Verify installation from the public signed release
        env:
          WEBMCP_HOME: ${{ runner.temp }}/public-release-install
        run: |
          node dist/cli.js install --browser chromium --user-data-dir "$RUNNER_TEMP/public-release-chrome"
          node dist/cli.js config
          node dist/cli.js doctor
          WEBMCP_HOME="$RUNNER_TEMP/public-release-bun" bun dist/cli.js install --browser chromium --user-data-dir "$RUNNER_TEMP/public-release-bun-chrome"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-validation
          path: |
            artifacts/*.png
            artifacts/*.tgz
            artifacts/release*.json
            artifacts/skill.zip
  npm:
    needs: release
    if: >-
      always() && (needs.release.result == 'success' ||
      (github.ref == 'refs/heads/master' &&
      (inputs.npm_only || contains(github.event.head_commit.message, '[npm-publish]'))))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v1.0.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Fetch already checked npm archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft | grep -Fx false
          gh release download "$RELEASE_TAG" --pattern '*.tgz' --dir artifacts
      - name: Publish public npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun x npm@11.5.1 publish ./artifacts/*.tgz --registry=https://registry.npmjs.org --access=public --provenance --ignore-scripts

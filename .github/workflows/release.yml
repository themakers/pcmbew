name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check release identity
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: bun install
      - run: bun run check
      - run: bun run build
      - run: bun run test
      - run: test -z "$(git ls-files dist artifacts)"
      - run: bun scripts/artifacts.ts
      - run: bun x playwright install --with-deps chromium
      - run: bun run test:browser
      - run: bun x npm@11.5.1 pack --ignore-scripts --pack-destination artifacts
      - run: bun scripts/release.ts
      - name: Publish complete GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "WebMCP Bridge $GITHUB_REF_NAME" --notes "Native WebMCP extension and host. Read README/SKILL.md for agent-led setup. Five stable MCP tools on localhost:8777."
          gh release upload "$GITHUB_REF_NAME" artifacts/runtime.zip artifacts/extension.zip artifacts/skill.zip artifacts/*.tgz artifacts/release.json artifacts/release.sigstore.json
          gh release edit "$GITHUB_REF_NAME" --draft=false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-validation
          path: |
            artifacts/*.png
            artifacts/*.tgz
            artifacts/release*.json
  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Fetch already checked npm archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --pattern '*.tgz' --dir artifacts
      - name: Publish public npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun x npm@11.5.1 publish artifacts/*.tgz --registry=https://registry.npmjs.org --access=public --provenance --ignore-scripts
